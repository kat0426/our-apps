<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>经期小本</title>
<style>
:root{--bg:#17141a;--card:#221e26;--line:#342e3a;--text:#ece6f0;--sub:#9a90a3;--acc:#a98bd9;--acc2:#e8a07a;--rose:#d9788d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;padding:22px 16px 130px;font-size:15px}
h1{font-size:24px;margin:0;letter-spacing:1px}
.sub{color:var(--sub);font-size:13px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.big{font-size:40px;font-weight:700;line-height:1.1}
.big small{font-size:15px;font-weight:400;color:var(--sub);margin-left:6px}
.tip{margin-top:12px;font-size:14px;line-height:1.7;color:#d8cfe0}
.tip b{color:var(--acc2)}
.pred{margin-top:10px;color:var(--sub);font-size:13px}
.pred b{color:var(--text)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head button{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:10px;width:34px;height:34px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;color:var(--sub);font-size:12px;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;background:#1c1920;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--sub);border:1px solid transparent}
.cal .d.per{background:var(--rose);color:#fff}
.cal .d.predict{border:1px dashed var(--rose);color:var(--text)}
.cal .d.today{border:1px solid var(--acc2)}
.cal .d.sel{outline:2px solid var(--acc);outline-offset:1px}
.dots{display:flex;gap:3px;margin-top:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.ds{background:var(--acc)}.dy{background:var(--acc2)}
.cal .d.per .dy{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--sub);font-size:12px;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.legend .a::before{background:var(--rose)}.legend .b::before{border:1px dashed var(--rose);border-radius:3px}.legend .c::before{background:var(--acc)}.legend .e::before{background:var(--acc2)}
label{display:block;color:var(--sub);font-size:13px;margin:14px 0 6px}
.row{display:flex;gap:10px}
.btn{border:none;border-radius:12px;padding:11px 14px;font-size:15px;background:var(--acc);color:#1b1620;font-weight:600}
.btn.rose{background:var(--rose);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:400}
.btn.full{width:100%;margin-top:14px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:14px}
.seg button.on{border-color:var(--rose);color:var(--text);background:#3a2530}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:14px}
.chip.on{background:#3d2e22;border-color:var(--acc2);color:var(--text)}
.soup{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:14px}
.soup.on{border-color:var(--acc);background:#2c2438}
.soup span{font-size:14px}
.soup b{color:var(--acc);font-size:14px}
input{width:100%;background:#1a171d;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 12px;font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:var(--acc)}
.list .item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.list .item:last-child{border-bottom:none}
.list .meta{color:var(--sub);font-size:12px;margin-top:3px}
.list .len{color:var(--acc2);text-align:right}
.foot{color:var(--sub);font-size:12px;line-height:1.7;margin-top:6px}
.foot a{color:var(--acc)}
.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#3a2f48;color:var(--text);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:8}
.modal.show{display:flex}
.modal .card{width:100%;max-width:420px}
.modal textarea{width:100%;height:180px;background:#1a171d;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<a href="首页.html" style="display:inline-block;color:#9a90a3;text-decoration:none;font-size:14px;margin-bottom:10px">‹ 我们家</a>

<h1>经期小本</h1>
<div class="sub">来了、走了点一下就好，剩下的姐姐帮你算</div>

<div class="card" style="margin-top:18px">
  <div class="big" id="state"></div>
  <div class="tip" id="tip"></div>
  <div class="pred" id="pred"></div>
</div>

<div class="card">
  <div class="cal-head">
    <button id="prevM">‹</button>
    <b id="monthTitle"></b>
    <button id="nextM">›</button>
  </div>
  <div class="cal" id="cal"></div>
  <div class="legend"><span class="a">经期</span><span class="b">预计</span><span class="c">四物汤</span><span class="e">有不舒服</span></div>
</div>

<div class="card">
  <b id="selTitle"></b>
  <div class="row" style="margin-top:12px">
    <button class="btn rose" id="startBtn" style="flex:1">这天来了</button>
    <button class="btn ghost" id="endBtn" style="flex:1">这天走了</button>
  </div>
  <label>量</label>
  <div class="seg" id="flowSeg"><button data-v="少">少</button><button data-v="中">中</button><button data-v="多">多</button></div>
  <label>不舒服的地方</label>
  <div class="chips" id="symChips"></div>
  <div class="soup" id="soupRow"><span>四物汤（放鸡胸肉）</span><b id="soupTxt">没喝</b></div>
  <label>想说的（可不填）</label>
  <input id="note" placeholder="比如：下午有点头晕">
  <button class="btn full" id="saveDay">存好了</button>
</div>

<div class="card list" id="history"></div>

<div class="foot">
  预测是按你以前的周期算的，你的周期本来就不太准（37 到 56 天都有过），只能当个大概。<br>
  数据存在这台手机的浏览器里。隔一阵子点 <a href="#" id="openBackup">备份</a>，复制给姐姐放进我们家。
</div>

<div class="modal" id="modal">
  <div class="card">
    <b>备份 / 恢复</b>
    <div class="sub">复制下面这串发给姐姐；要恢复，就粘贴进来点「恢复」。</div>
    <textarea id="backupText"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="copyB" style="flex:1">复制</button>
      <button class="btn ghost" id="restoreB" style="flex:1">恢复</button>
      <button class="btn ghost" id="closeB" style="flex:1">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='yiqing_period_v1';
const SYMS=['头晕','肚子痛','腰酸','牙龈肿','冒痘','上火','没精神'];
const $=id=>document.getElementById(id);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>fmt(new Date());
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};

let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
if(!db||!db.periods){
  db={periods:[{start:'2026-08-01',end:''},{start:'2026-09-07',end:''},{start:'2026-11-02',end:'2026-11-08'}],days:{}};
  save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function sorted(){return db.periods.slice().sort((a,b)=>a.start<b.start?-1:1)}

// 某天属于哪次经期
function periodOf(s){
  const ps=sorted(),t=today();
  for(let i=ps.length-1;i>=0;i--){
    const p=ps[i];if(p.start>s)continue;
    let end=p.end;
    if(!end){ // 没记结束：最近一次且10天内当作还在；旧的只算第一天
      end=(i===ps.length-1&&diff(p.start,t)<=10)?(t<addD(p.start,9)?t:addD(p.start,9)):p.start;
    }
    if(s<=end)return {p:p,day:diff(p.start,s)+1,ongoing:!p.end};
    return null;
  }
  return null;
}
function cycles(){
  const ps=sorted(),c=[];
  for(let i=1;i<ps.length;i++)c.push(diff(ps[i-1].start,ps[i].start));
  return c;
}
function prediction(){
  const ps=sorted();if(!ps.length)return null;
  const c=cycles();if(!c.length)return null;
  const last=ps[ps.length-1].start;
  const lo=Math.min(...c),hi=Math.max(...c),avg=Math.round(c.reduce((a,b)=>a+b,0)/c.length);
  return {from:addD(last,lo),to:addD(last,hi),mid:addD(last,avg),lo,hi,avg};
}
function soupDays(){return Object.keys(db.days).filter(k=>db.days[k].soup).sort()}

/* ---------- 顶部状态 ---------- */
function renderState(){
  const t=today(),ps=sorted(),pr=prediction(),cur=periodOf(t);
  let state='',tip='';
  if(cur){
    state='经期第 '+cur.day+' 天';
    if(cur.day<=2)tip='头两天：<b>别碰冰的</b>，肚子和脚都捂暖，四物汤先别喝。';
    else if(cur.day<=3)tip='第二三天<b>容易头晕</b>，起身慢一点，饭要吃够。';
    else tip='快结束了，还是少吃冰。走了那天记得点「这天走了」。';
  }else if(ps.length){
    const last=ps[ps.length-1];
    const n=diff(last.start,t)+1;
    state='距上次第 '+n+' 天';
    if(last.end){
      const after=diff(last.end,t);
      const sd=soupDays().filter(d=>d>last.end);
      if(after>=1&&after<=12&&sd.length<6){
        tip=sd.length?'四物汤喝了 <b>'+sd.length+'</b> 天，再喝 '+(6-sd.length)+' 天就好。放块鸡胸肉 😏':(after<=5?'干净了，<b>这几天开始喝四物汤</b>，连喝五六天。':'');
      }
    }
    if(!tip&&pr){
      const toFrom=diff(t,pr.from);
      if(toFrom<=7&&toFrom>=-30)tip='快到经前了：<b>忌冰少甜</b>，丹栀逍遥丸吃起来（来了就停），牙龈肿就喷西瓜霜，多睡一点。';
      else tip='这段时间就好好吃饭睡觉，姐姐看着日子。';
    }
  }
  $('state').innerHTML=state||'还没记录';
  $('tip').innerHTML=tip;
  $('pred').innerHTML=pr?'下次大概在 <b>'+md(pr.from)+' – '+md(pr.to)+'</b> 之间，最可能 '+md(pr.mid)+' 左右':'再记一次，才能算出下次';
}

/* ---------- 月历 ---------- */
let viewY,viewM,sel=today(),flow='',syms=new Set(),soup=false;
{const t=new Date();viewY=t.getFullYear();viewM=t.getMonth();}
function renderCal(){
  $('monthTitle').textContent=viewY+' 年 '+(viewM+1)+' 月';
  const pr=prediction(),t=today();
  let h='';
  ['一','二','三','四','五','六','日'].forEach(w=>h+='<div class="wd">'+w+'</div>');
  const pad=(new Date(viewY,viewM,1).getDay()+6)%7;
  for(let i=0;i<pad;i++)h+='<div></div>';
  const days=new Date(viewY,viewM+1,0).getDate();
  for(let d=1;d<=days;d++){
    const s=fmt(new Date(viewY,viewM,d)),rec=db.days[s]||{};
    let cls='d';
    if(periodOf(s))cls+=' per';
    else if(pr&&s>=pr.from&&s<=pr.to&&s>t)cls+=' predict';
    if(s===t)cls+=' today';
    if(s===sel)cls+=' sel';
    h+='<div class="'+cls+'" data-d="'+s+'">'+d+'<div class="dots">'+(rec.soup?'<i class="ds"></i>':'')+((rec.sym&&rec.sym.length)?'<i class="dy"></i>':'')+'</div></div>';
  }
  $('cal').innerHTML=h;
  $('cal').querySelectorAll('.d').forEach(c=>c.onclick=()=>{sel=c.dataset.d;renderCal();loadDay()});
}
$('prevM').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--}renderCal()};
$('nextM').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++}renderCal()};

/* ---------- 某一天 ---------- */
function loadDay(){
  const r=db.days[sel]||{},po=periodOf(sel);
  $('selTitle').textContent=md(sel)+(po?' · 经期第 '+po.day+' 天':'');
  flow=r.flow||'';syms=new Set(r.sym||[]);soup=!!r.soup;$('note').value=r.note||'';
  document.querySelectorAll('#flowSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===flow));
  $('symChips').innerHTML=SYMS.map(s=>'<button class="chip'+(syms.has(s)?' on':'')+'" data-v="'+s+'">'+s+'</button>').join('');
  $('symChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{syms.has(c.dataset.v)?syms.delete(c.dataset.v):syms.add(c.dataset.v);c.classList.toggle('on')});
  paintSoup();
}
function paintSoup(){$('soupRow').classList.toggle('on',soup);$('soupTxt').textContent=soup?'喝了 ✓':'没喝'}
$('soupRow').onclick=()=>{soup=!soup;paintSoup()};
document.querySelectorAll('#flowSeg button').forEach(b=>b.onclick=()=>{
  flow=flow===b.dataset.v?'':b.dataset.v;
  document.querySelectorAll('#flowSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v===flow));
});
$('saveDay').onclick=()=>{
  const r={flow:flow,sym:[...syms],soup:soup,note:$('note').value.trim()};
  if(!r.flow&&!r.sym.length&&!r.soup&&!r.note)delete db.days[sel];else db.days[sel]=r;
  save();renderAll();toast(soup?'四物汤记上了 💜':'存好了 💜');
};
$('startBtn').onclick=()=>{
  const po=periodOf(sel);
  if(po&&po.p.start===sel){
    if(!confirm('取消 '+md(sel)+' 这次的记录？'))return;
    db.periods=db.periods.filter(p=>p.start!==sel);save();renderAll();toast('取消了');return;
  }
  if(po){toast('这天已经在经期里了');return}
  db.periods.push({start:sel,end:''});save();renderAll();
  toast('记下了，来了第一天。别碰冰的 💜');
};
$('endBtn').onclick=()=>{
  const ps=sorted().filter(p=>p.start<=sel);
  if(!ps.length){toast('先记哪天来的');return}
  const p=db.periods.find(x=>x.start===ps[ps.length-1].start);
  if(diff(p.start,sel)>14){toast('离上次来太远了，是不是选错日子');return}
  p.end=sel;save();renderAll();
  toast('记下了，一共 '+(diff(p.start,sel)+1)+' 天。接下来喝四物汤');
};

/* ---------- 历史 ---------- */
function renderHistory(){
  const ps=sorted();
  let h='<b>以前的</b>';
  ps.slice().reverse().forEach((p,i,arr)=>{
    const next=arr[i-1];
    const len=p.end?(diff(p.start,p.end)+1)+' 天':'—';
    const cyc=next?'隔了 '+diff(p.start,next.start)+' 天':'';
    h+='<div class="item"><div>'+md(p.start)+(p.end?' – '+md(p.end):'')+'<div class="meta">持续 '+len+'</div></div><div class="len">'+cyc+'</div></div>';
  });
  const c=cycles();
  if(c.length)h+='<div class="meta" style="margin-top:8px">周期平均 '+Math.round(c.reduce((a,b)=>a+b,0)/c.length)+' 天，最短 '+Math.min(...c)+'，最长 '+Math.max(...c)+'</div>';
  $('history').innerHTML=h;
}

/* ---------- 备份 ---------- */
$('openBackup').onclick=e=>{e.preventDefault();$('backupText').value=JSON.stringify(db);$('modal').classList.add('show')};
$('closeB').onclick=()=>$('modal').classList.remove('show');
$('copyB').onclick=()=>{const ta=$('backupText');ta.select();
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('复制好了')).catch(()=>{document.execCommand('copy');toast('复制好了')});
  else{document.execCommand('copy');toast('复制好了')}};
$('restoreB').onclick=()=>{try{const d=JSON.parse($('backupText').value);if(!d.periods)throw 0;
  if(!confirm('用这份备份覆盖现在的记录？'))return;db=d;db.days=db.days||{};save();$('modal').classList.remove('show');renderAll();toast('恢复好了')}catch(e){toast('这串好像不是备份')}};

function renderAll(){renderState();renderCal();loadDay();renderHistory()}
renderAll();
</script>
</body>
</html>
